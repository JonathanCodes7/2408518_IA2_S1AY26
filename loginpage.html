<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <!--Link To CSS-->
    <link rel="stylesheet" href="stylesss.css">
    <!--Box Icons-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/boxicons@latest/css/boxicons.min.css">
    <!--Favicon-->
    <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
    <header>
        <div class="navbar-container">
                <!--Login Button-->
                <a href="" class="logo"><i class='bx bx-home'></i>Home Rental Site</a>
                <!--Sign Up/Register Button-->
                <a href="index.html" class="btn">Sign Up!</a>
        </div>
    </header>
    <!--Login Section-->
    <div class="login-page">
        <div class="login-container">
            <h2>Login To Continue</h2>
            <p>Log in with the information<br>you signed up with</p>
            <!--Login Form-->
            <form action="iaindex.html">
                <span>Enter your email address</span>
                <input type="email" name="" id="" placeholder="Email Address" required>
                <span>Enter your password</span>
                <input type="password" name="" id="" placeholder="Password" required>
                <input type="submit" value="Log In" class="button">
            </form>
            <a href="index.html" class="btn">Dont Have an Account? Register an Account Here</a>
        </div>
    </div>
</body>
</html>
