<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Rental Checkout!</title>
    <!--Link To CSS-->
    <link rel="stylesheet" href="stylesss.css">
    <!--Box Icons-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/boxicons@latest/css/boxicons.min.css">
    <!--Favicon-->
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <!--Javascript-->
    <script src="ia_script.js" defer></script>
</head>
<body>
    <header>
        <div class="navbar-container">
            <a href="product.html" class="logo"><i class='bx bx-home'></i>House Rentals</a>
            <input type="checkbox" name="" id="menu">
            <label for="menu" class="menu-icon"><i class='bx bx-menu' id="menu-icon"></i></label>
            <ul class="navbar">
                <li><a href="product.html">Home</a></li>
                <li><a href="product.html#about">About</a></li>
                <li><a href="product.html#properties">Properties</a></li>
                <li><a href="cart.html">Cart (<span id="cart-count">0</span>)</a></li>
            </ul>
            <div class="header-right">
                <a href="index.html" class="btn">Log In</a>
            </div>
        </div>
    </header>

    <!-- Checkout Section -->
    <section class="checkout-page-container">
        <div class="container">
            <div class="heading">
                <span>Checkout</span>
                <h2>Complete Your Booking</h2>
            </div>

            <div class="checkout-layout">
                <!-- Order Summary -->
                <div class="checkout-summary">
                    <h3>Order Summary</h3>
                    <div id="checkout-items-container" class="checkout-items-container">
                        <!-- Items inserted dynamically -->
                    </div>
                    <div class="summary-row">
                        <span>Subtotal:</span>
                        <span id="checkout-subtotal">$0.00</span>
                    </div>
                    <div class="summary-row">
                        <span>Discount:</span>
                        <span id="checkout-discount">$0.00</span>
                    </div>
                    <div class="summary-row">
                        <span>Tax:</span>
                        <span id="checkout-tax">$0.00</span>
                    </div>
                    <div class="summary-row total">
                        <span>Total:</span>
                        <span id="checkout-total">$0.00</span>
                    </div>
                </div>

                <!-- Checkout Form -->
                <div class="checkout-form">
                    <h3>Shipping & Payment Details</h3>
                    <form id="checkout-form">
                        <div class="form-group">
                            <label for="full-name">Full Name</label>
                            <input type="text" id="full-name" name="fullName" placeholder="John Doe" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" name="email" placeholder="johndoe@example.com" required>
                        </div>
                            <div class="form-group">
                            <label for="trn">TRN (000-000-000)</label>
                            <input type="text" id="trn" name="trn" placeholder="123-456-789" required>
                        </div>

                        <div class="form-group">
                            <label for="phone">Phone Number</label>
                            <input type="tel" id="phone" name="phone" placeholder="(876) 555-1234" required>
                        </div>
                        <div class="form-group">
                            <label for="address">Shipping Address</label>
                            <textarea id="address" name="address" rows="3" placeholder="Enter your full address" required></textarea>
                        </div>

                        <h4>Payment Information</h4>
                        <div class="form-group">
                            <label for="card-number">Card Number</label>
                            <input type="text" id="card-number" name="cardNumber" placeholder="1234 5678 9012 3456" required>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="expiry-date">Expiry Date</label>
                                <input type="text" id="expiry-date" name="expiryDate" placeholder="MM/YY" required>
                            </div>
                            <div class="form-group">
                                <label for="cvv">CVV</label>
                                <input type="text" id="cvv" name="cvv" placeholder="123" required>
                            </div>
                        </div>

                        <div class="checkout-actions">
                            <button type="button" id="cancel-checkout-btn" class="btn secondary">Cancel</button>
                            <button type="submit" id="confirm-checkout-btn" class="btn">Confirm & Pay</button>
                        </div>
                    </form>
                    <p id="checkout-message" class="checkout-message"></p>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
