<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <!--Link To CSS-->
    <link rel="stylesheet" href="stylesss.css">
    <!--Box Icons-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/boxicons@latest/css/boxicons.min.css">
    <!--Favicon-->
    <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
    <header>
        <div class="navbar-container">
                <!--Login Button-->
                <a href="" class="logo"><i class='bx bx-home'></i>Home Rental Site</a>
                <!--Direct to Login Page-->
                <a href="loginpage.html" class="btn">Log In</a>
        </div>
    </header>
    <!--Sign Up-->
    <div class="login-page">
        <div class="login-container">
            <h2>Welcome, Let's Get You Signed In!</h2>
            <!--Login Form-->
            <form action="loginpage.html">
                <span>Enter your Username</span>
                <input type="text" name="" id="" placeholder="Username" required>
                <span>Enter your Phone Number</span>
                <input type="tel" name="" id="" placeholder="(123)456-7890" required>
                <span>Enter your email address</span>
                <input type="email" name="" id="" placeholder="Email Address" required>
                <span>Enter your password</span>
                <input type="password" name="" id="" placeholder="Password" required>
                <input type="submit" value="Log In" class="button">
                <a href="loginpage.html"> Already Have an Account?</a>
            </form>
            <a href="loginpage.html" class="btn">Log In Here</a>
        </div>
    </div>
</body>
</html>
